name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish native host
        run: dotnet publish host -c Release

      - name: Build installer
        run: iscc installer\cliprange.iss

      - name: Zip extension
        run: Compress-Archive -Path extension\* -DestinationPath installer\dist\ClipRange-extension-${{ github.ref_name }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/*
          generate_release_notes: true
